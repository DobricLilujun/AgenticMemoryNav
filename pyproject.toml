[project]
name = "agentic-memory-nav"
version = "0.1.0"
description = "Training-free, memory-aware co-planning for long-horizon robot navigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"matplotlib>=3.8",
	"networks>=0.3.7",
	"networkx>=3.2",
	"numpy>=1.26",
	"Pillow>=10.0",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
	"mypy>=1.10",
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"ruff>=0.6",
	"types-networkx>=3.2",
	"types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory_nav"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["external-lib", "outputs", "notebooks", "build", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks reference names bound in earlier cells; external-lib is third-party.
extend-exclude = ["notebooks", "external-lib", "outputs", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/agentic_memory_nav/agent/lingbot/*.py" = ["E402"]
"src/agentic_memory_nav/visualization/realtime_pointcloud_viewer.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentic_memory_nav"]
