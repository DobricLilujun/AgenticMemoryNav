[project]
name = "agentic-memory-nav"
version = "0.1.0"
description = "Training-free, memory-aware co-planning for long-horizon robot navigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"matplotlib>=3.8",
	"networkx>=3.2",
	"numpy>=1.26",
	"PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
	"mypy>=1.10",
	"pytest>=8.0",
	"pytest-asyncio>=0.23",
	"ruff>=0.6",
	"types-networkx>=3.2",
	"types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory_nav"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentic_memory_nav"]
