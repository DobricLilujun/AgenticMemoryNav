# =============================================================================
# isaacsim_realtime_agent_internscenes.yaml —— Isaac Sim 实时多智能体导航
# 运行时配置(中文标注)。仅增加注释，未改动任何配置值(已验证)。
#
# 结构: runtime(运行) / mapping(建图) / perception(感知) / execution(执行)。
#
# 坐标约定(已标准化):
#   odom = USD 世界系, Z 轴朝上; Pose3D/robot_start 直接存 odom (x, y, z), 无重映射。
#   base_link: X 前 / Y 左 / Z 上 (ROS REP 105); yaw 绕 odom Z, yaw=0 时 base +X 对齐 odom +X。
#   camera_link: 固定在机器狗上的相机安装系; 相机光学系 -Z 看 / +Y 上 (Isaac 标准)。
# =============================================================================

runtime:
  # 运行控制:
  #   output_root  每次运行输出根目录(帧/轨迹/summary)。
  #   max_steps    智能体主循环最多执行步数, 达到即结束。
  #   instruction  自然语言任务指令, 交给任务解析器与感知(VLM)理解。
  output_root: outputs
  max_steps: 60
  instruction: "Find a window in the room"

mapping:
  # 建图: mock 后端用 MockMapper(无真实 SLAM/几何), 仅靠 RGB+位姿反投影
  #   固定 2.0m 深度; keyframe_interval=1 表示每帧都作为关键帧。
  backend: mock
  keyframe_interval: 1

perception:
  # 感知: vlm 后端用真实视觉语言模型(Qwen3.8)对图像做语义理解/检测。
  #   base_url 为 vLLM 服务(OpenAI 兼容 /v1); api_key 非真实凭证(服务未强制校验)。
  backend: vlm
  model_id: Inferact/Qwen3.8-27B-NVFP4
  base_url: http://10.6.32.16:8000/v1
  api_key: dummy
  api: openai-completions
  timeout: 120.0

execution:
  # ---------------------------------------------------------------------------
  # 场景 / 机器人 / 灯光
  # ---------------------------------------------------------------------------
  # 场景: InternScenes 场景(GLB→USD 转换)。它是 Y-up, 执行器在 Z-up 舞台重定向它
  #   (scene_up_axis=y 触发 90° 包装层, 把场景放入 /World/scene 并对齐 Z-up)。
  #   light_rig=gray_studio 用 Isaac Sim 内置 Grey Studio 灯光(中性稳定)。
  # 机器人: Go2 物理版 USD; robot_motion_mode=kinematic 冻结全部腿部关节,
  #   导航只平移/旋转整个 Go2 身体(无步态/关节控制)。
  scene: /home/snt/projects/AgenticMemoryNav/issacsim-assets/scene0004_00/usd/scene.usd
  scene_up_axis: y
  light_rig: gray_studio
  robot_usd: /home/snt/Desktop/Go2/configuration/go2_description_physics.usd
  robot_motion_mode: kinematic

  # ---------------------------------------------------------------------------
  # 初始位姿与放置校验
  # ---------------------------------------------------------------------------
  # 坐标系(已标准化):
  #   odom = USD 世界系, Z 轴朝上; Pose3D/robot_start 直接存 odom (x, y, z), 无重映射。
  #   base_link: X 前 / Y 左 / Z 上; yaw 绕 odom Z, yaw=0 时 base +X 对齐 odom +X。
  # robot_start.position 为 odom 系 (x, y, z)。此处 [2.59, 1.0, 0.35] 对应旧配置
  #   [2.59, 0.35, 1.0](x,height,north) 映射到同一物理点, 以保持机器狗落点不变。
  # 该初始位置已用 PhysX overlap 扫描与激活的 Go2 articulation 验证是否撞墙。
  # validate_initial_placement=true: 若智能体循环开始前 Go2 站立体积与场景碰撞体
  #   相交, 则直接拒绝初始化(抛错), 避免机器人一开始就嵌进墙/地板。
  robot_start:
    position: [1.73, 2.22, 0.35]
    yaw_deg: -135.0
  validate_initial_placement: false

  # ---------------------------------------------------------------------------
  # 环境平面: 地面/天花板的尺寸与中心由“已加载场景 USD 的世界包围盒”推导。
  #   各字段: enabled 是否启用 / prim_path USD 路径 / margin_m 四周外扩 /
  #   z_offset_m 相对面高度的偏移 / color 颜色 / collision_enabled 是否作 PhysX 碰撞体。
  # ---------------------------------------------------------------------------
  environment_planes:
    ground:
      enabled: true
      prim_path: /World/GroundPlane
      margin_m: 0.5
      z_offset_m: -0.02
      color: [0.18, 0.20, 0.22]
      collision_enabled: true
    ceiling:
      enabled: true
      prim_path: /World/CeilingPlane
      margin_m: 0.5
      z_offset_m: 0.02
      color: [0.82, 0.84, 0.88]
      collision_enabled: true

  # ---------------------------------------------------------------------------
  # 相机 / 流媒体
  # ---------------------------------------------------------------------------
  # 仅 head 一路相机: agent 实际使用的镜头, parented 到 Go2 身体, 随其自动运动。
  # go2_camera_orient: 相对默认 look-at 姿态的 X/Y/Z 欧拉角偏移(度); 0,0,0 即无偏移。
  # keep_streaming=true: 预览/agent 运行结束后仍保持 WebRTC 流不关闭。
  # head_scan_*: 头镜头在身体偏航之外的小幅周期扫视; 0=静止, 仅触发后才按正弦扰动。
  #   head_scan_period_frames 为扫视完整周期(帧)。
  # bind_viewport_to_camera=true: WebRTC 视口指向头相机(而非默认 persp 相机)。
  go2_camera_orient: [90.0, 0.0, 0.0]
  keep_streaming: true
  head_scan_yaw_deg: 0.0
  head_scan_pitch_deg: 0.0
  head_scan_period_frames: 24
  bind_viewport_to_camera: true

  # ---------------------------------------------------------------------------
  # 运动 / 速度 / 分辨率
  # ---------------------------------------------------------------------------
  # max_speed / max_angular_speed: 线/角速度上限(执行与安全层共用)。
  # max_action_timeout: 单动作最大超时(秒), 超过则安全校验拒绝。
  # headless=true: 无 UI 运行。
  # camera_width/height: 渲染分辨率(320×240, 低分辨率省算力/适配 WebRTC)。
  # camera_focal_length: 焦距(毫米), 越小视场(FOV)越广; 2.0 给 agent 更宽视野。
  # camera_fps: 帧率, 作用于头相机, 有效范围 30–60。
  # stream_width/height: WebRTC 流分辨率, 用 --livestream 时必须匹配客户端协商
  #   的最大分辨率, 否则插件会因“超过最大尺寸”警告而丢帧。
  max_speed: 0.35
  max_angular_speed: 0.8
  max_action_timeout: 20.0
  headless: true
  camera_width: 1280
  camera_height: 720
  camera_focal_length: 1.0
  camera_fps: 30
  stream_width: 1280
  stream_height: 720