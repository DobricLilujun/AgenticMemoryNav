runtime:
  output_root: outputs
  max_steps: 50
  instruction: "Find the red cup in the digital twin warehouse"
mapping:
  backend: mock
  keyframe_interval: 1
perception:
  backend: vlm
  model_id: Inferact/Qwen3.8-27B-NVFP4
  base_url: http://10.6.32.16:8000/v1
  api_key: dummy
  api: openai-completions
  timeout: 120.0
execution:
  # NVIDIA Digital Twin Warehouse environment. This is a more realistic, denser
  # warehouse interior than the simplified warehouse demo and is intended for
  # multi-zone search, occlusion, and long-horizon navigation.
  scene: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.0/Isaac/Environments/Digital_Twin_Warehouse/digital_twin_warehouse.usd
  max_speed: 0.38
  max_angular_speed: 0.8
  max_action_timeout: 20.0
  headless: true
  camera_width: 320
  camera_height: 240
  waypoint_duration_s: 5.0
  # Must match the WebRTC client's negotiated max resolution when using --livestream,
  # or the client rejects every frame with "exceeds the max of ..." warnings.
  stream_width: 1280
  stream_height: 720
