project:
  name: Agentic Memory Nav MVP
  seed: 42
runtime:
  output_root: outputs
  queue_size: 64
  max_frames: 4
  verbose: false
mapping:
  backend: mock
  keyframe_interval: 2
  mock_depth_m: 2.0
  device: cpu
perception:
  backend: mock
  device: cpu
memory:
  backend: sqlite
  vector_backend: local
planning:
  backend: rule_based
  approach_distance: 0.6
  replan_every_frames: 1
execution:
  backend: unitree_sim
  real_robot_enabled: false
  max_speed: 0.5
  max_angular_speed: 1.0
  max_action_timeout: 15.0