runtime:
  output_root: outputs
  max_steps: 60
  instruction: "Find a window in the room"

mapping:
  backend: mock
  keyframe_interval: 1

perception:
  backend: vlm
  model_id: Inferact/Qwen3.8-27B-NVFP4
  base_url: http://10.6.32.16:8000/v1
  api_key: dummy
  api: openai-completions
  timeout: 120.0

execution:
  scene: /home/snt/projects/AgenticMemoryNav/issacsim-assets/scene0000_00/usd/scene.usd
  scene_up_axis: y
  light_rig: gray_studio
  robot_usd: /home/snt/projects/AgenticMemoryNav/issacsim-assets/Go2/configuration/go2_description_physics.usd
  robot_motion_mode: kinematic

  # If robot_start is omitted, preview scripts fall back to the companion
  # scene.json go2_placement field.
  robot_start:
    position: [2.59, 1.0, 0.35]
    yaw_deg: 180.0
  validate_initial_placement: true

  environment_planes:
    ground:
      enabled: true
      prim_path: /World/GroundPlane
      margin_m: 0.5
      z_offset_m: -0.02
      color: [0.18, 0.20, 0.22]
      collision_enabled: true
    ceiling:
      enabled: true
      prim_path: /World/CeilingPlane
      margin_m: 0.5
      z_offset_m: 0.02
      color: [0.82, 0.84, 0.88]
      collision_enabled: true


  go2_camera_orient: [0.0, 0.0, 0.0]
  keep_streaming: true
  head_scan_yaw_deg: 0.0
  head_scan_pitch_deg: 0.0
  head_scan_period_frames: 24
  bind_viewport_to_camera: true


  max_speed: 0.35
  max_angular_speed: 0.8
  max_action_timeout: 20.0
  headless: true
  camera_width: 1280
  camera_height: 720
  camera_focal_length: 1.0
  camera_fps: 30
  stream_width: 1280
  stream_height: 720