runtime:
  output_root: outputs
  max_steps: 40
  instruction: "Find the red cup in the kitchen"
mapping:
  backend: mock
  keyframe_interval: 1
perception:
  backend: vlm
  model_id: Inferact/Qwen3.8-27B-NVFP4
  base_url: http://10.6.32.16:8000/v1
  api_key: dummy
  api: openai-completions
  timeout: 90.0
# Real, physically-simulated ObjectNav-style search target (not the InteriorAgent
# dataset, which requires a separate scene download). The VLM must actually see
# this cuboid for the agent to succeed.
objectnav:
  target_name: red_cup
  # Vector3 order matches this project's Pose3D convention: (x, height_up, north).
  target_position: [1.2, 0.2, 0.0]
  target_color: [1.0, 0.0, 0.0]
  target_scale: 0.3
execution:
  max_speed: 0.5
  max_angular_speed: 1.0
  max_action_timeout: 15.0
  headless: true
  camera_width: 256
  camera_height: 192
  waypoint_duration_s: 4.0
